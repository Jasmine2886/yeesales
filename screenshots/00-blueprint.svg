<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="548" viewBox="0 0 1240 548">
<defs><filter id="sh" x="-5%%" y="-5%%" width="110%%" height="115%%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0B1B12" flood-opacity="0.05"/></filter></defs>
<rect width="1240" height="548" fill="#FFFFFF"/>
<text x="40" y="52" font-family="PingFang SC,Helvetica Neue,Arial" font-size="25" font-weight="700" fill="#12181F">一个 BD 的 SFF 一周：你负责见人，AI 负责其余</text>
<text x="40" y="82" font-family="PingFang SC,Helvetica Neue,Arial" font-size="14" fill="#6B7480">三个工作阶段，12 个动作：9 个由 AI 做完交给你，3 个必须你点头才生效</text>
<line x1="40" y1="104" x2="1200" y2="104" stroke="#EAEDF1"/>
<rect x="40.0" y="126" width="373.3" height="326" rx="14" fill="#FFFFFF" stroke="#E4E8EE" filter="url(#sh)"/>
<path d="M40.0 126 h373.3 a14,14 0 0 1 14,14 v38 h-373.3 v-38 a14,14 0 0 1 14,-14 z" fill="#F6FBF8"/>
<rect x="41.0" y="127" width="371.3" height="52" fill="#F6FBF8"/>
<circle cx="70.0" cy="152" r="13" fill="#00A85A"/>
<text x="70.0" y="157" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="92.0" y="152" font-family="PingFang SC,Helvetica Neue,Arial" font-size="16" font-weight="700" fill="#12181F">展前</text>
<text x="92.0" y="169" font-family="PingFang SC,Helvetica Neue,Arial" font-size="12.5" fill="#5B6572">把要见的人定下来</text>
<text x="62.0" y="214" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#9AA1AC" letter-spacing="1">你要做的</text>
<circle cx="66.0" cy="232" r="3" fill="#12181F"/>
<text x="78.0" y="236" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">定下要见哪 20 家：AI 给排序和理由，你拍板</text>
<circle cx="66.0" cy="258" r="3" fill="#12181F"/>
<text x="78.0" y="262" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">带上对方上次聊的卡点，别到了现场再重复问</text>
<line x1="60.0" y1="292" x2="393.3" y2="292" stroke="#EDF0F4"/>
<text x="62.0" y="318" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#00A85A" letter-spacing="1">AI 替你做完</text>
<path d="M63.0 334 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80.0" y="340" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">从 340 家参展商里筛出 20 家有中国付款信号的</text>
<text x="80.0" y="360" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">PSP</text>
<path d="M63.0 380 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80.0" y="386" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">每家附一段「为什么约」和对方业务摘要</text>
<path d="M63.0 406 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80.0" y="412" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">20 封英文约见邮件写好，存草稿箱，你逐封按发送</text>
<path d="M63.0 432 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80.0" y="438" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">航班、酒店、展馆动线排好，确认后写进你的日历</text>
<rect x="433.3" y="126" width="373.3" height="326" rx="14" fill="#FFFFFF" stroke="#E4E8EE" filter="url(#sh)"/>
<path d="M433.3 126 h373.3 a14,14 0 0 1 14,14 v38 h-373.3 v-38 a14,14 0 0 1 14,-14 z" fill="#F6FBF8"/>
<rect x="434.3" y="127" width="371.3" height="52" fill="#F6FBF8"/>
<circle cx="463.3" cy="152" r="13" fill="#00A85A"/>
<text x="463.3" y="157" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="485.3" y="152" font-family="PingFang SC,Helvetica Neue,Arial" font-size="16" font-weight="700" fill="#12181F">展中</text>
<text x="485.3" y="169" font-family="PingFang SC,Helvetica Neue,Arial" font-size="12.5" fill="#5B6572">你见人，它记事</text>
<text x="455.3" y="214" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#9AA1AC" letter-spacing="1">你要做的</text>
<circle cx="459.3" cy="232" r="3" fill="#12181F"/>
<text x="471.3" y="236" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">见人、聊、判断这家值不值得跟</text>
<circle cx="459.3" cy="258" r="3" fill="#12181F"/>
<text x="471.3" y="262" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">只记要点，名片拍一张就够了</text>
<line x1="453.3" y1="292" x2="786.7" y2="292" stroke="#EDF0F4"/>
<text x="455.3" y="318" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#00A85A" letter-spacing="1">AI 替你做完</text>
<path d="M456.3 334 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="473.3" y="340" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">名片拍照即建档，重复的自动合并到同一家</text>
<path d="M456.3 360 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="473.3" y="366" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">录音转写，提炼「对方要什么、卡在哪、下一步」</text>
<path d="M456.3 386 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="473.3" y="392" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">见面前一分钟推小抄：上次邮件、WhatsApp 卡点、</text>
<text x="473.3" y="412" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">文化注意</text>
<path d="M456.3 432 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="473.3" y="438" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">报价和账期问题留给你，AI 不替你承诺</text>
<rect x="826.7" y="126" width="373.3" height="326" rx="14" fill="#FFFFFF" stroke="#E4E8EE" filter="url(#sh)"/>
<path d="M826.7 126 h373.3 a14,14 0 0 1 14,14 v38 h-373.3 v-38 a14,14 0 0 1 14,-14 z" fill="#F6FBF8"/>
<rect x="827.7" y="127" width="371.3" height="52" fill="#F6FBF8"/>
<circle cx="856.7" cy="152" r="13" fill="#00A85A"/>
<text x="856.7" y="157" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="878.7" y="152" font-family="PingFang SC,Helvetica Neue,Arial" font-size="16" font-weight="700" fill="#12181F">展后</text>
<text x="878.7" y="169" font-family="PingFang SC,Helvetica Neue,Arial" font-size="12.5" fill="#5B6572">当天出跟进计划</text>
<text x="848.7" y="214" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#9AA1AC" letter-spacing="1">你要做的</text>
<circle cx="852.7" cy="232" r="3" fill="#12181F"/>
<text x="864.7" y="236" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">只做一件事：逐条点「批准 / 改 / 不要」</text>
<circle cx="852.7" cy="258" r="3" fill="#12181F"/>
<text x="864.7" y="262" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">决定先跟谁、先放谁</text>
<line x1="846.7" y1="292" x2="1180.0" y2="292" stroke="#EDF0F4"/>
<text x="848.7" y="318" font-family="PingFang SC,Helvetica Neue,Arial" font-size="11.5" font-weight="700" fill="#00A85A" letter-spacing="1">AI 替你做完</text>
<path d="M849.7 334 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="866.7" y="340" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">当晚把 21 场沟通归到各自客户名下</text>
<path d="M849.7 360 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="866.7" y="366" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">排出 9 家值得马上跟进，其中 A 级 3 家</text>
<path d="M849.7 386 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="866.7" y="392" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">生成 26 条待办和 12 封跟进邮件草稿</text>
<path d="M849.7 412 l4 4 l7 -8" fill="none" stroke="#00A85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="866.7" y="418" font-family="PingFang SC,Helvetica Neue,Arial" font-size="13.5" fill="#2A313A">看板阶段前移，每条结论都能点开看依据</text>
<rect x="40" y="478" width="1160" height="46" rx="10" fill="#F2FAF5" stroke="#CFEBD9"/>
<text x="62" y="507" font-family="PingFang SC,Helvetica Neue,Arial" font-size="14" font-weight="700" fill="#00693C">边界：</text>
<text x="108" y="507" font-family="PingFang SC,Helvetica Neue,Arial" font-size="14" fill="#2A313A">发不发、改不改、报什么价，三件事始终在你手上。AI 只做准备，不替你承诺，不擅自改 CRM。</text>
</svg>